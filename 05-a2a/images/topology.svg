<text x="30" y="353.85" font-size="13.5" font-weight="400" fill="#5A6570">Each peer owns its agent and its tools. The caller is offered neither, only the agent card and the reply.</text>
<text x="30" y="374.85" font-size="13.5" font-weight="400" fill="#5A6570">Each message without a context_id starts a new conversation on the peer.</text>
