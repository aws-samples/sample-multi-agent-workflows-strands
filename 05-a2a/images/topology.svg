<rect width="867" height="402" fill="#FFFFFF"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#16191F">Lab 5  ·  A2A  ·  the caller picks the peer, its owner decides the answer</text>
<text x="30" y="58" font-size="14" font-weight="400" fill="#5A6570">Each peer runs its own server. The caller reaches it over HTTP and reads only its reply.</text>
<g transform="translate(30, 96)">
<style>
  text { font-family: 'Helvetica', system-ui, sans-serif; }
</style>
