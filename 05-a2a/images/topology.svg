<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 867 402" width="867" height="402" style="--bg:#FFFFFF;--fg:#16191F;--line:#6C7781;--accent:#5A6570;--muted:#5A6570;--surface:#FFFFFF;--border:#C6CDD5;background:#FFFFFF">
