<text x="30" y="34" font-size="19" font-weight="700" fill="#16191F">Lab 4  ·  Swarm evidence gathering  ·  deterministic final analysis</text>
<text x="30" y="58" font-size="14" fill="#5A6570">Investigators choose the evidence path. Validated tool outputs then cross a fixed boundary to one final analyzer.</text>
