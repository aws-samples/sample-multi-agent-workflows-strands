<text x="1020.0" y="247.0" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="1020.0" dy="-3.9">Validate evidence</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="1020.0" dy="16.9">deterministic Python</tspan></text>
