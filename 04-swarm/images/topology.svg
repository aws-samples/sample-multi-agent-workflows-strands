<polygon points="324,177 315.0,180.2 315.0,173.8" fill="#5A6570"/>
<rect x="214.9" y="162" width="84.2" height="30" rx="2" fill="#FFFFFF" stroke="#e3e3e4" stroke-width="1"/>
<text x="257" y="181" text-anchor="middle" font-size="11" fill="#5A6570">entry_point</text>
