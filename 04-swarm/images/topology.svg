<text x="1087" y="306" text-anchor="middle" font-size="11" fill="#5A6570">run exactly once</text>
<rect x="1130" y="330" width="200" height="54" fill="#FFFFFF" stroke="#8D99A6" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1230.0" y="357.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5A6570"><tspan x="1230.0" dy="-3.9">Root cause and fix</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="1230.0" dy="16.9">result</tspan></text>
