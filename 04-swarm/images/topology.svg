<polygon points="1124,357 1115.0,360.2 1115.0,353.8" fill="#5A6570"/>
<rect x="1130" y="443" width="200" height="54" fill="#FFFFFF" stroke="#8D99A6" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1230.0" y="470.0" text-anchor="middle" font-size="13" font-weight="500" fill="#5A6570"><tspan x="1230.0" dy="-3.9">Past incidents</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="1230.0" dy="16.9">AgentCore Memory</tspan></text>
<polyline points="1020,390 1020,470 1124,470" fill="none" stroke="#6C7781" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="1124,470 1115.0,473.2 1115.0,466.8" fill="#5A6570"/>
<rect x="917.9" y="455" width="84.2" height="30" rx="2" fill="#FFFFFF" stroke="#e3e3e4" stroke-width="1"/>
<text x="960" y="474" text-anchor="middle" font-size="11" fill="#5A6570">recall tool</text>
<text x="30" y="548" font-size="13.5" fill="#5A6570">Each two-way arrow is a handoff_to_agent call. A run uses only some of them; node_history shows which.</text>
<text x="30" y="569" font-size="13.5" fill="#5A6570">Strands completes a Swarm when the active investigator does not hand off, so tool-call validation—not status alone—closes evidence gathering.</text>
<text x="30" y="590" font-size="13.5" fill="#5A6570">The analyzer is outside the Swarm: it receives the validated evidence, recalls memory, answers once, and is never a handoff target.</text>
</svg>
