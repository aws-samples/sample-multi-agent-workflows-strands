<text x="800" y="306" text-anchor="middle" font-size="11" fill="#5A6570">required tools</text>
<rect x="920" y="330" width="200" height="54" fill="#FFFFFF" stroke="#067D62" stroke-width="2.2"/>
<text x="1020.0" y="357.0" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="1020.0" dy="-3.9">Final Analyzer</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="1020.0" dy="16.9">analyzer</tspan></text>
