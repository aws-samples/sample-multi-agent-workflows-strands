<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 394" width="1376" height="394" style="--bg:#FFFFFF;--fg:#16191F;--line:#6C7781;--accent:#5A6570;--muted:#5A6570;--surface:#FFFFFF;--border:#C6CDD5;background:#FFFFFF">
<style>
  text { font-family: Helvetica; }
</style>
<rect width="1376" height="394" fill="#FFFFFF"/>
<text x="30" y="34" font-size="19" font-weight="700" fill="#16191F">Lab 2  ·  Graph  ·  your code owns the route</text>
<text x="30" y="58" font-size="14" font-weight="400" fill="#5A6570">Nodes and edges are declared before the run. A condition on an edge decides whether it is followed.</text>
<g transform="translate(30, 96)">
<style>
  text { font-family: 'Helvetica', system-ui, sans-serif; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="#5A6570" stroke="#5A6570" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="#5A6570" stroke="#5A6570" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="batch" data-label="same batch, run concurrently">
  <rect x="155.518" y="8" width="159.906" height="213.60000000000002" rx="12" ry="12" fill="none" stroke="#146EB4" stroke-width="1.4" stroke-dasharray="6 6" opacity="0.8" />
  <text x="235.471" y="-1" text-anchor="middle" font-size="13" font-weight="700" fill="#146EB4">same batch, run concurrently</text>
</g>
<polyline class="edge" data-from="review" data-to="manager_approval" data-style="solid" data-arrow-start="false" data-arrow-end="true" data-label="condition: needs_manager" points="483.68999999999994,128.8 745.486,128.8" fill="none" stroke="#6C7781" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="manager_approval" data-to="session" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="saved after every node" points="900.068,128.8 1146.42,128.8" fill="none" stroke="#6C7781" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="intake" data-to="policy_check" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="85.518,128.8 129.25900000000001,128.8 129.25900000000001,78.9 173,78.9" fill="none" stroke="#6C7781" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="intake" data-to="receipt_check" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="85.518,128.8 129.25900000000001,128.8 129.25900000000001,178.70000000000002 173,178.70000000000002" fill="none" stroke="#6C7781" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="policy_check" data-to="review" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="294.978,78.9 343.16499999999996,78.9 343.16499999999996,128.8 385.424,128.8" fill="none" stroke="#6C7781" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="receipt_check" data-to="review" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="300.906,178.70000000000002 343.16499999999996,178.70000000000002 343.16499999999996,128.8 385.424,128.8" fill="none" stroke="#6C7781" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="review" data-to="manager_approval" data-label="condition: needs_manager">
  <rect x="543.6899999999999" y="112.80000000000001" width="141.79600000000005" height="30.3" rx="2" ry="2" fill="#FFFFFF" stroke="#e3e3e4" stroke-width="1" />
  <text x="614.588" y="127.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6570" dy="3.8499999999999996">condition: needs_manager</text>
</g>
<g class="edge-label" data-from="manager_approval" data-to="session" data-label="saved after every node">
  <rect x="960.068" y="112.80000000000001" width="126.35200000000003" height="30.3" rx="2" ry="2" fill="#FFFFFF" stroke="#e3e3e4" stroke-width="1" />
  <text x="1023.244" y="127.95000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#5A6570" dy="3.8499999999999996">saved after every node</text>
</g>
<g class="node" data-id="intake" data-label="Intake
intake" data-shape="rectangle">
  <rect x="8" y="101.9" width="77.518" height="53.800000000000004" rx="0" ry="0" fill="#FFFFFF" stroke="#232F3E" stroke-width="2.2" />
  <text x="46.759" y="128.8" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="46.759" dy="-3.9000000000000012">Intake</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="46.759" dy="16.900000000000002">intake</tspan></text>
</g>
<g class="node" data-id="review" data-label="Reviewer
review" data-shape="rectangle">
  <rect x="385.424" y="101.9" width="98.26599999999999" height="53.800000000000004" rx="0" ry="0" fill="#FFFFFF" stroke="#067D62" stroke-width="2.2" />
  <text x="434.55699999999996" y="128.8" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="434.55699999999996" dy="-3.9000000000000012">Reviewer</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="434.55699999999996" dy="16.900000000000002">review</tspan></text>
</g>
<g class="node" data-id="manager_approval" data-label="Manager Approval
manager_approval" data-shape="rectangle">
  <rect x="745.486" y="101.9" width="154.582" height="53.800000000000004" rx="0" ry="0" fill="#FFFFFF" stroke="#146EB4" stroke-width="1.8" />
  <text x="822.777" y="128.8" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="822.777" dy="-3.9000000000000012">Manager Approval</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="822.777" dy="16.900000000000002">manager_approval</tspan></text>
</g>
<g class="node" data-id="session" data-label="Graph state
S3SessionManager" data-shape="rectangle">
  <rect x="1146.42" y="101.9" width="161.251" height="53.800000000000004" rx="0" ry="0" fill="#FFFFFF" stroke="#8D99A6" stroke-width="1.4"  stroke-dasharray="7 5" />
  <text x="1227.0455000000002" y="128.8" text-anchor="middle" font-size="13" font-weight="500" fill="#5A6570"><tspan x="1227.0455000000002" dy="-3.9000000000000012">Graph state</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="1227.0455000000002" dy="16.900000000000002">S3SessionManager</tspan></text>
</g>
<g class="node" data-id="policy_check" data-label="Policy Check
policy_check" data-shape="rectangle">
  <rect x="173" y="52" width="121.978" height="53.800000000000004" rx="0" ry="0" fill="#FFFFFF" stroke="#146EB4" stroke-width="1.8" />
  <text x="233.989" y="78.9" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="233.989" dy="-3.9000000000000012">Policy Check</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="233.989" dy="16.900000000000002">policy_check</tspan></text>
</g>
<g class="node" data-id="receipt_check" data-label="Receipt Check
receipt_check" data-shape="rectangle">
  <rect x="173" y="151.8" width="127.906" height="53.800000000000004" rx="0" ry="0" fill="#FFFFFF" stroke="#146EB4" stroke-width="1.8" />
  <text x="236.953" y="178.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="#16191F"><tspan x="236.953" dy="-3.9000000000000012">Receipt Check</tspan><tspan font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5A6570" x="236.953" dy="16.900000000000002">receipt_check</tspan></text>
</g>

</g>
<text x="30" y="345.6" font-size="13.5" font-weight="400" fill="#5A6570">Dashed edge: the session manager saves the graph state, so a fresh instance can resume it.</text>
<text x="30" y="366.6" font-size="13.5" font-weight="400" fill="#5A6570">manager_approval raises an interrupt, so the run ends as INTERRUPTED rather than completed.</text>
</svg>
